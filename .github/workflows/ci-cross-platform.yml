name: CI Cross-Platform

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Setup project (venv, deps, db)
        run: python scripts/start_siem.py --setup-only

      - name: Run API smoke test
        run: python scripts/test_all.py

      - name: Run frontend static assets test
        run: python scripts/test_frontend_assets.py
